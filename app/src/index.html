<!doctype html>
<html lang="fr">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Blume Finder</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <main>
    <header>
      <h1>Blume Finder</h1>
      <p class="sous-titre">Retrouver un fichier d'après son contenu.</p>
    </header>

    <input id="recherche" type="search" autocomplete="off" spellcheck="false"
           placeholder="Décrire ce qui est recherché : « contrat de location », « billets de train Toulouse »…">

    <section class="dossiers" aria-label="Dossiers indexés">
      <ul id="liste-dossiers"></ul>
      <button id="ajouter" type="button">Ajouter un dossier</button>
    </section>

    <p id="etat" aria-live="polite"></p>
    <div id="resultats"></div>
  </main>

  <footer>
    <span class="pastille" aria-hidden="true"></span>
    <span>Lecture seule · Traitement entièrement local</span>
  </footer>

  <script src="main.js"></script>
</body>
</html>
